services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_rag"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    # 下列 ${...} 由 compose 自動讀取專案根目錄的 .env 代入
    # 注意:容器內的 localhost 不是你的 Mac,若 LLM 跑在本機請改用
    # host.docker.internal 或直接指向區網 IP
    environment:
      DATABASE_URL: postgresql://postgres:secret@db:5432/enterprise_rag
      CHAT_BASE_URL: ${CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
