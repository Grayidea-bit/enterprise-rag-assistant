services:
  db:
    # 釘到 pgvector 版本而非浮動的 pg18 tag,讓 benchmark 數字可以重現
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_rag"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    # 下列 ${...} 由 compose 自動讀取專案根目錄的 .env 代入
    # 注意:容器內的 localhost 不是你的 Mac,若 LLM 跑在本機請改用
    # host.docker.internal 或直接指向區網 IP
    environment:
      DATABASE_URL: postgresql://postgres:secret@db:5432/enterprise_rag
      CHAT_BASE_URL: ${CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      AGENT_REQUEST_LIMIT: ${AGENT_REQUEST_LIMIT:-6}
      AGENT_TOOL_CALLS_LIMIT: ${AGENT_TOOL_CALLS_LIMIT:-4}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      AUTH_MODE: ${AUTH_MODE:-api_key}
      # 容器啟動時自動套用 migration,讓 `docker compose up` 開箱即用
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
